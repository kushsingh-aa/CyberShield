services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
    volumes:
      - cybershield-data:/data

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  cybershield-data:
